[package]
name = "ganalyzer"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.31"
rfd = "0.15"
base64 = "0.21"
image = { version = "0.25", default-features = false, features = ["png"] }

[build-dependencies]
winres = "0.1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "warn"
unimplemented = "warn"
